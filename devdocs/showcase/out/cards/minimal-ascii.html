<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Minimal ASCII</title>
  <style>
    :root {
      color-scheme: light;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      background: #e8edf5;
      width: 1400px;
      min-height: 280px;
      overflow: hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    body {
      padding: 28px;
    }
    .card {
      border: 1px solid #c7d2e5;
      border-radius: 20px;
      background: linear-gradient(180deg, #f8fafc 0%, #f8fafcee 100%);
      padding: 24px 26px 28px;
      box-shadow: 0 18px 60px rgba(15, 23, 42, 0.18);
    }
    .eyebrow {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4b5563;
      margin-bottom: 10px;
    }
    .title {
      font-size: 30px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 18px;
    }
    .line {
      white-space: pre-wrap;
      font-size: 30px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">xline showcase</div>
    <h1 class="title">Minimal ASCII</h1>
    <div class="line"><span style="color: #00ffff">Haiku 4</span><span style="color: #7f7f7f"> | </span><span style="color: #00ff00">reply-fast-path</span><span style="color: #7f7f7f"> | </span><span style="color: #5c5cff">fix/reply-flow</span> <span style="color: #5c5cff">✓</span><span style="color: #7f7f7f"> | </span><span style="color: #ff00ff">2.1% · 4.2k tokens</span><span style="color: #7f7f7f"> | </span><span style="color: #aa5500">$0.08</span><span style="color: #7f7f7f"> | </span><span style="color: #00aa00">41s</span> <span style="color: #00aa00"></span><span style="color: #00aa00">+7</span> <span style="color: #aa0000">-2</span></div>
  </div>
</body>
</html>
